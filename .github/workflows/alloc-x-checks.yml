name: Alloc-X Console and Core Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/console/**'
      - 'packages/**'
      - 'services/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/alloc-x-checks.yml'
  push:
    branches: [fix/payments-history-main-wallet-payroll]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run repository checks and console regressions
        run: npm run check
