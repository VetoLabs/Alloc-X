<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alloc-X Final Product Mockup</title>
<style>
:root{--navy:#071b3f;--teal:#18c7b1;--blue:#3d63f2;--ink:#0d1b34;--muted:#65728a;--bg:#e9eef6}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{height:72px;background:var(--navy);color:white;display:flex;align-items:center;padding:0 28px;gap:18px;position:sticky;top:0;z-index:2}header b{font-size:22px}header span{color:var(--teal);font-size:11px;letter-spacing:.12em;font-weight:800}nav{display:flex;gap:8px;padding:16px 24px;overflow:auto;background:#fff;border-bottom:1px solid #dbe3ef}.tab{border:1px solid #dbe3ef;background:#f8fafd;border-radius:12px;padding:10px 14px;white-space:nowrap;font:inherit;font-size:12px;font-weight:700;color:#56647c;cursor:pointer}.tab span{color:var(--blue);margin-right:7px}.tab.active{background:var(--blue);border-color:var(--blue);color:#fff}.tab.active span{color:#cfd8ff}main{padding:24px;display:grid;place-items:center}.frame{width:min(1440px,100%);aspect-ratio:1440/1024;background:white;border-radius:18px;overflow:hidden;box-shadow:0 22px 60px rgba(18,37,75,.16)}iframe{display:block;width:100%;height:100%;border:0}.note{text-align:center;font-size:12px;color:var(--muted);padding:0 24px 28px}</style></head>
<body><header><b>Alloc-X</b><span>FINAL PRODUCT EXPERIENCE</span></header><nav><button data-screen="01-command-centre.svg" class="tab active"><span>01</span>Command Centre</button><button data-screen="02-agent-payment.svg" class="tab"><span>02</span>Agent Payment</button><button data-screen="03-security-approvals.svg" class="tab"><span>03</span>Security &amp; Approvals</button><button data-screen="04-payment-receipt.svg" class="tab"><span>04</span>Payment &amp; Receipt</button><button data-screen="05-policy-studio.svg" class="tab"><span>05</span>Policy Studio</button><button data-screen="06-offline-sync.svg" class="tab"><span>06</span>Offline &amp; Sync</button><button data-screen="07-proof-reporting.svg" class="tab"><span>07</span>Proof &amp; Reporting</button></nav><main><div class="frame"><iframe id="screen" src="mockups/screens/01-command-centre.svg"></iframe></div></main><div class="note">Use the tabs to review the complete experience. The source screens remain editable vector assets.</div>
<script>const tabs=[...document.querySelectorAll('.tab')],frame=document.querySelector('#screen');tabs.forEach(tab=>tab.addEventListener('click',()=>{tabs.forEach(x=>x.classList.remove('active'));tab.classList.add('active');frame.src='mockups/screens/'+tab.dataset.screen}));</script></body></html>
